<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app"> {{ mensagem }} </div>

    <script>
        const Mensagem = {
            data(){
                return{
                    mensagem: 'Hello World Vue'
                }
            }
        }

        Vue.createApp(Mensagem).mount('#app')
    </script>
</body>
</html>
